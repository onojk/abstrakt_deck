name: abstrakt-deck
title: Abstrakt Deck
version: '0.1.8'
summary: Audio-reactive kaleidoscope visualizer with MIDI input and video export
description: |
  Abstrakt Deck turns live audio into generative visuals in real time. Feed it
  microphone, system audio, or MIDI and it renders reactive kaleidoscopes,
  particle fields, and video-feedback effects on the GPU at full frame rate.

  Built in Rust on wgpu — runs on Vulkan and stays fast on integrated graphics.

  - Per-band audio detection with ADSR envelopes and tempo tracking
  - MIDI input for live control
  - Color theory system with simultaneous-contrast rendering
  - Multi-panel grid layouts
  - Record straight to MP4, up to 4K

  Free and open source, MIT licensed.
license: MIT
contact: https://github.com/onojk/abstrakt_deck/issues
issues: https://github.com/onojk/abstrakt_deck/issues
source-code: https://github.com/onojk/abstrakt_deck
website: https://github.com/onojk/abstrakt_deck

base: core22
grade: stable
confinement: strict

apps:
  abstrakt-deck:
    command: bin/abstrakt-deck
    extensions: [gnome]
    plugs:
      - opengl
      - wayland
      - x11
      - audio-playback

parts:
  abstrakt-deck:
    plugin: rust
    source: .
    build-packages:
      - pkg-config
      - libasound2-dev
      - libfontconfig1-dev
      - libx11-dev
      - libxcb1-dev
      - libxcursor-dev
      - libxrandr-dev
      - libxi-dev
      - libwayland-dev
    stage-packages:
      - libasound2
